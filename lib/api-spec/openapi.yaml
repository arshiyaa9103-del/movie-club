openapi: "3.1.0"
info:
  title: Api
  version: "1.0.0"
servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      summary: Get current user profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    post:
      operationId: upsertMe
      summary: Create or update current user (JIT provisioning)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /groups:
    get:
      operationId: getGroups
      summary: List user's groups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      summary: Create a new group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}:
    get:
      operationId: getGroup
      summary: Get group detail
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "404":
          description: Not found
    patch:
      operationId: updateGroup
      summary: Update group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    delete:
      operationId: deleteGroup
      summary: Delete group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content

  /groups/{groupId}/members:
    get:
      operationId: getGroupMembers
      summary: List group members
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"

  /groups/{groupId}/members/{memberId}:
    delete:
      operationId: removeGroupMember
      summary: Remove a member from the group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content

  /groups/{groupId}/invites:
    post:
      operationId: createInvite
      summary: Create an invite link for a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"

  /invites/{token}:
    get:
      operationId: getInvite
      summary: Get invite info by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteDetail"
        "404":
          description: Not found

  /invites/{token}/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invite and join the group
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /movies/search:
    get:
      operationId: searchMovies
      summary: Search movies via OMDB
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovieSearchResult"

  /movies/{imdbId}:
    get:
      operationId: getMovie
      summary: Get movie detail from OMDB
      parameters:
        - name: imdbId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieDetail"
        "404":
          description: Not found

  /groups/{groupId}/movies:
    get:
      operationId: getGroupMovies
      summary: List movies in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMovie"
    post:
      operationId: addGroupMovie
      summary: Add a movie to the group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMovieInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMovie"

  /groups/{groupId}/movies/{entryId}:
    delete:
      operationId: removeGroupMovie
      summary: Remove a movie from the group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content

  /groups/{groupId}/movies/{entryId}/status:
    put:
      operationId: setMovieStatus
      summary: Set current user's status for a movie
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieStatusInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieStatus"
    delete:
      operationId: removeMovieStatus
      summary: Remove current user's status for a movie
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content

  /groups/{groupId}/movies/{entryId}/reviews:
    get:
      operationId: getReviews
      summary: List reviews for a movie in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      summary: Post a review for a movie in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
        - name: entryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{reviewId}:
    patch:
      operationId: updateReview
      summary: Update a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
    delete:
      operationId: deleteReview
      summary: Delete a review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: No content

  /groups/{groupId}/stats:
    get:
      operationId: getGroupStats
      summary: Get group statistics (counts by status, top liked)
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupStats"

  /me/activity:
    get:
      operationId: getMyActivity
      summary: Get recent activity across all user groups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    User:
      type: object
      required: [id, clerkId, displayName, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        isGuest:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        isGuest:
          type: boolean

    Group:
      type: object
      required: [id, name, createdAt, memberCount, movieCount]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
        memberCount:
          type: integer
        movieCount:
          type: integer
        myRole:
          type: ["string", "null"]

    GroupInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    GroupUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    GroupMember:
      type: object
      required: [id, userId, displayName, role, joinedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
        joinedAt:
          type: string

    Invite:
      type: object
      required: [id, token, groupId, createdAt]
      properties:
        id:
          type: integer
        token:
          type: string
        groupId:
          type: integer
        createdAt:
          type: string

    InviteDetail:
      type: object
      required: [token, groupName, memberCount]
      properties:
        token:
          type: string
        groupName:
          type: string
        memberCount:
          type: integer
        description:
          type: ["string", "null"]

    MovieSearchResult:
      type: object
      required: [imdbId, title, year, poster]
      properties:
        imdbId:
          type: string
        title:
          type: string
        year:
          type: string
        poster:
          type: ["string", "null"]
        type:
          type: string

    MovieDetail:
      type: object
      required: [imdbId, title, year]
      properties:
        imdbId:
          type: string
        title:
          type: string
        year:
          type: string
        plot:
          type: ["string", "null"]
        poster:
          type: ["string", "null"]
        imdbRating:
          type: ["string", "null"]
        genre:
          type: ["string", "null"]
        director:
          type: ["string", "null"]
        actors:
          type: ["string", "null"]
        runtime:
          type: ["string", "null"]

    GroupMovie:
      type: object
      required: [id, groupId, imdbId, title, year, addedAt]
      properties:
        id:
          type: integer
        groupId:
          type: integer
        imdbId:
          type: string
        title:
          type: string
        year:
          type: string
        poster:
          type: ["string", "null"]
        imdbRating:
          type: ["string", "null"]
        genre:
          type: ["string", "null"]
        addedAt:
          type: string
        addedByName:
          type: ["string", "null"]
        myStatus:
          type: ["string", "null"]
        statusCounts:
          $ref: "#/components/schemas/StatusCounts"
        reviewCount:
          type: integer

    GroupMovieInput:
      type: object
      required: [imdbId, title, year]
      properties:
        imdbId:
          type: string
        title:
          type: string
        year:
          type: string
        poster:
          type: ["string", "null"]
        imdbRating:
          type: ["string", "null"]
        genre:
          type: ["string", "null"]

    StatusCounts:
      type: object
      properties:
        want_to_watch:
          type: integer
        watched:
          type: integer
        liked:
          type: integer

    MovieStatus:
      type: object
      required: [id, entryId, userId, status, createdAt]
      properties:
        id:
          type: integer
        entryId:
          type: integer
        userId:
          type: integer
        status:
          type: string
          enum: [want_to_watch, watched, liked]
        createdAt:
          type: string

    MovieStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [want_to_watch, watched, liked]

    Review:
      type: object
      required: [id, entryId, userId, displayName, body, createdAt]
      properties:
        id:
          type: integer
        entryId:
          type: integer
        userId:
          type: integer
        displayName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        body:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    ReviewInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1

    ReviewUpdate:
      type: object
      properties:
        body:
          type: string
          minLength: 1

    GroupStats:
      type: object
      required: [totalMovies, statusCounts, topLiked, recentlyWatched]
      properties:
        totalMovies:
          type: integer
        statusCounts:
          $ref: "#/components/schemas/StatusCounts"
        topLiked:
          type: array
          items:
            $ref: "#/components/schemas/GroupMovie"
        recentlyWatched:
          type: array
          items:
            $ref: "#/components/schemas/GroupMovie"

    ActivityItem:
      type: object
      required: [id, type, groupId, groupName, actorName, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
        groupId:
          type: integer
        groupName:
          type: string
        actorName:
          type: string
        movieTitle:
          type: ["string", "null"]
        movieId:
          type: ["integer", "null"]
        detail:
          type: ["string", "null"]
        createdAt:
          type: string
